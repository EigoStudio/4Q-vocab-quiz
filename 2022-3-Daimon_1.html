<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2022-3 大問1 Vocabulary Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-bg: #f5f5f5; --p1-primary: #ff9800;
            --p2-bg: #f0f4f8; --p2-primary: #2196f3;
            --white: #ffffff; --text-dark: #212121;
            --success: #4caf50; --error: #f44336;
            --base-font: 'Andika', "Hiragino Maru Gothic ProN", sans-serif;
        }

        body { font-family: var(--base-font); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.3s; }
        body.part1-mode { background-color: var(--p1-bg); }
        body.part2-mode { background-color: var(--p2-bg); }

        header { width: 100%; padding: 20px 0; text-align: center; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .part1-mode header { background-color: var(--p1-primary); }
        .part2-mode header { background-color: var(--p2-primary); }

        .tab-container { display: flex; width: 95%; max-width: 600px; margin: 15px 0; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px 10px 0 0; background: #ccc; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--white); cursor: default; }
        .part1-mode .tab-btn.active { color: var(--p1-primary); border-top: 4px solid var(--p1-primary); }
        .part2-mode .tab-btn.active { color: var(--p2-primary); border-top: 4px solid var(--p2-primary); }

        .container { max-width: 600px; width: 92%; background: var(--white); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px; box-sizing: border-box; }
        .q-num { color: #888; margin-bottom: 10px; }
        .question-text { font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; line-height: 1.5; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .choice-btn { background: var(--white); border: 2px solid #e0e0e0; padding: 15px 5px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .choice-btn.correct { background-color: var(--success) !important; color: white; border-color: var(--success); }
        .choice-btn.wrong { background-color: var(--error) !important; color: white; border-color: var(--error); opacity: 0.6; }

        #feedback-area { margin-top: 20px; display: none; padding: 15px; border-radius: 10px; background: #f0fdf4; }
        .next-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; background: var(--p1-primary); margin-top: 10px; }
        .part2-mode .next-btn { background: var(--p2-primary); }
        
        .report-btn { background-color: #e91e63; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .sentence-gap { text-decoration: underline; font-weight: bold; color: #2196f3; padding: 0 10px; }

        /* 印刷専用画面用スタイル (非表示) */
        #print-area { display: none; }

        /* 印刷設定 (Cmd+P / Ctrl+P 時) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 15mm;
            }
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
            }
            header, .tab-container, #quiz-screen, #result-screen {
                display: none !important;
            }
            #print-area {
                display: block !important;
                width: 100%;
            }
            .print-title {
                text-align: center;
                font-size: 16pt;
                font-weight: bold;
                border-bottom: 2px solid #000;
                padding-bottom: 5px;
                margin-bottom: 15px;
            }
            .print-section-title {
                font-size: 13pt;
                font-weight: bold;
                margin: 15px 0 8px 0;
                border-left: 4px solid #333;
                padding-left: 6px;
            }
            .print-q-item {
                margin-bottom: 12px;
                page-break-inside: avoid;
            }
            .print-q-text {
                font-weight: bold;
                margin-bottom: 4px;
            }
            .print-choices {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 5px;
                padding-left: 15px;
            }
            .print-choice-item {
                font-size: 10pt;
            }
        }
    </style>
</head>
<body class="part1-mode">

<header>
    <h1 style="margin:0; font-size: 1.3rem;">2022-3 大問1 Vocabulary Quiz</h1>
</header>

<div class="tab-container" id="tabs">
    <button id="tab1" class="tab-btn active" onclick="switchPart(1)">Part 1: 単語</button>
    <button id="tab2" class="tab-btn" onclick="switchPart(2)">Part 2: 熟語・文法</button>
</div>

<div class="container" id="quiz-screen">
    <div class="q-num" id="progress">Question 1 / --</div>
    <div class="question-text" id="question-display">Loading...</div>
    <div class="choices-grid" id="choices-container"></div>
    <div id="feedback-area">
        <span style="color:var(--success); font-weight:bold; font-size:1.4rem;">Correct! ✨</span><br>
        <button class="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
</div>

<div class="container" id="result-screen" style="display:none;">
    <h2>Quiz Complete!</h2>
    <p style="font-size: 1.3rem; margin: 20px 0;">一発正解スコア: <span id="final-score" style="font-weight:bold; color:var(--success);">0</span></p>
    <button class="report-btn" onclick="sendReport()">Tamaki先生に報告する</button>
    <button class="next-btn" style="background:#9e9e9e;" onclick="location.reload()">もう一度挑戦</button>
</div>

<!-- 印刷用ワークシート生成領域 -->
<div id="print-area">
    <div class="print-title">英検4級 2022-3 大問1 ワークシート</div>
    <div id="print-content"></div>
</div>

<script>
// --- Data Structure ---
const part1Data = [
    {q:"rich", a:"金持ちの", c:["簡単な", "忙しい", "古い"]},
    {q:"easy", a:"簡単な", c:["難しい", "高い", "重い"]},
    {q:"visit", a:"訪れる", c:["帰る", "出発する", "止まる"]},
    {q:"towel", a:"タオル", c:["プール", "ドア", "コップ"]},
    {q:"found", a:"見つけた", c:["買った", "置いた", "言った"]},
    {q:"met", a:"会った", c:["作った", "買った", "探した"]},
    {q:"bought", a:"買った", c:["売った", "洗った", "泳いだ"]},
    {q:"put", a:"置く", c:["投げる", "切る", "開ける"]},
    {q:"mountain", a:"山", c:["川", "海", "公園"]},
    {q:"garden", a:"庭", c:["部屋", "家", "学校"]},
    {q:"busy", a:"忙しい", c:["暇な", "静かな", "速い"]},
    {q:"interesting", a:"面白い", c:["退屈な", "美しい", "悲しい"]},
    {q:"language", a:"言語", c:["音楽", "歴史", "数学"]},
    {q:"useful", a:"役立つ", c:["冷たい", "危険な", "汚い"]},
    {q:"full", a:"満杯の", c:["空っぽの", "少ない", "新しい"]},
    {q:"often", a:"よく", c:["たまに", "明日", "昨日"]},
    {q:"travel", a:"旅行する", c:["練習する", "料理する", "歩く"]},
    {q:"introduce", a:"紹介する", c:["質問する", "答える", "走る"]},
    {q:"myself", a:"私自身", c:["あなた自身", "彼自身", "彼女自身"]},
    {q:"temple", a:"寺", c:["城", "海", "山"]},
    {q:"forest", a:"森", c:["湖", "島", "川"]},
    {q:"country", a:"国", c:["町", "市", "村"]},
    {q:"history", a:"歴史", c:["時間", "世界", "科学"]},
    {q:"hurry up", a:"急ぐ", c:["休む", "座る", "起きる"]},
    {q:"soon", a:"すぐに", c:["遅く", "昔", "ずっと"]},
    {q:"late", a:"遅れた", c:["早い", "嬉しい", "確かな"]},
    {q:"glad", a:"嬉しい", c:["怒った", "悲しい", "疲れた"]},
    {q:"sure", a:"確信して", c:["たぶん", "残念で", "決して"]},
    {q:"arrive", a:"到着する", c:["出発する", "閉める", "寝る"]},
    {q:"close", a:"閉める", c:["開ける", "曲がる", "洗う"]},
    {q:"said", a:"言った", c:["聞いた", "忘れた", "作った"]},
    {q:"forgot", a:"忘れた", c:["覚えた", "見つけた", "呼んだ"]},
    {q:"Which", a:"どちら", c:["誰の", "どこ", "誰"]},
    {q:"Whose", a:"誰の", c:["どちら", "どこ", "なぜ"]},
    {q:"Where", a:"どこ", c:["いつ", "なぜ", "どのように"]},
    {q:"Who", a:"誰", c:["何", "いつ", "どちら"]}
];

const part2Data = [
    {q:"Let's go. We'll be <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> for the bus.", a:"late", c:["fast", "glad", "sure"]},
    {q:"The bus will leave <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> five minutes.", a:"in", c:["at", "on", "for"]},
    {q:"Dan will <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> a train to the airport because he doesn't have a car.", a:"take", c:["arrive", "sleep", "close"]},
    {q:"At a party, Shelly <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> some new friends.", a:"made", c:["said", "cooked", "forgot"]},
    {q:"Will you be in Vancouver <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> the weekend?", a:"for", c:["as", "to", "at"]},
    {q:"Yes, we'll <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> my friend's place.", a:"stay at", c:["look for", "get up", "run to"]},
    {q:"Which is <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> at your school, baseball or soccer?", a:"more popular", c:["most popular", "popularer", "popular"]},
    {q:"Keiko can swim faster <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> her classmates.", a:"than", c:["for", "and", "because"]},
    {q:"When Ben <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> going home on the train yesterday, he saw his old friend.", a:"was", c:["be", "were", "is"]}
];

// --- Logic ---
let currentSet = [];
let currentIndex = 0;
let isAnswered = false;
let firstTryCount = 0;
let isFirstTryInQ = true;
let currentPartName = "";

function switchPart(partNum) {
    currentPartName = (partNum === 1) ? "Part 1 (単語)" : "Part 2 (熟語・文法)";
    document.body.className = partNum === 1 ? 'part1-mode' : 'part2-mode';
    document.getElementById('tab1').className = partNum === 1 ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tab2').className = partNum === 2 ? 'tab-btn active' : 'tab-btn';
    
    let rawData = partNum === 1 ? [...part1Data] : [...part2Data];
    currentSet = rawData.sort(() => Math.random() - 0.5);
    
    currentIndex = 0;
    firstTryCount = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    showQuestion();
}

function showQuestion() {
    isAnswered = false;
    isFirstTryInQ = true;
    document.getElementById('feedback-area').style.display = 'none';
    const data = currentSet[currentIndex];
    document.getElementById('progress').textContent = `Question ${currentIndex + 1} / ${currentSet.length}`;
    document.getElementById('question-display').innerHTML = data.q;
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    
    const choices = [data.a, ...data.c].sort(() => Math.random() - 0.5);
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = choice;
        btn.onclick = () => {
            if (isAnswered) return;
            if (choice === data.a) {
                isAnswered = true;
                if (isFirstTryInQ) firstTryCount++;
                btn.classList.add('correct');
                document.getElementById('feedback-area').style.display = 'block';
            } else {
                isFirstTryInQ = false;
                btn.classList.add('wrong');
            }
        };
        container.appendChild(btn);
    });
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentSet.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').textContent = `${firstTryCount} / ${currentSet.length}`;
}

function sendReport() {
    const teacherEmail = "tamaki@eigostudio-stepforward.com";
    const subject = encodeURIComponent(`英検4級 2022-3 大問1 学習報告 (${currentPartName})`);
    const body = encodeURIComponent(`Tamaki先生へ\n\n英検4級 2022-3 大問1 Vocabulary Quizを完了しました！\n\n【今回の結果】\nコース: ${currentPartName}\n一発正解数: ${firstTryCount} / ${currentSet.length}\n\nこれからも頑張ります！`);
    window.location.href = `mailto:${teacherEmail}?subject=${subject}&body=${body}`;
}

// 印刷用ワークシートデータの構築
function buildPrintWorksheet() {
    const printContent = document.getElementById('print-content');
    let html = '<div class="print-section-title">Part 1: 単語</div>';
    
    part1Data.forEach((item, index) => {
        const choices = [item.a, ...item.c].sort();
        html += `
            <div class="print-q-item">
                <div class="print-q-text">(${index + 1}) ${item.q}</div>
                <div class="print-choices">
                    <div class="print-choice-item">1. ${choices[0]}</div>
                    <div class="print-choice-item">2. ${choices[1]}</div>
                    <div class="print-choice-item">3. ${choices[2]}</div>
                    <div class="print-choice-item">4. ${choices[3]}</div>
                </div>
            </div>
        `;
    });

    html += '<div class="print-section-title" style="margin-top:20px;">Part 2: 熟語・文法</div>';
    part2Data.forEach((item, index) => {
        const choices = [item.a, ...item.c].sort();
        const cleanQ = item.q.replace("<span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>", " ( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ) ");
        html += `
            <div class="print-q-item">
                <div class="print-q-text">(${index + 1}) ${cleanQ}</div>
                <div class="print-choices">
                    <div class="print-choice-item">1. ${choices[0]}</div>
                    <div class="print-choice-item">2. ${choices[1]}</div>
                    <div class="print-choice-item">3. ${choices[2]}</div>
                    <div class="print-choice-item">4. ${choices[3]}</div>
                </div>
            </div>
        `;
    });

    printContent.innerHTML = html;
}

window.onload = () => {
    switchPart(1);
    buildPrintWorksheet();
};
</script>
</body>
</html>
