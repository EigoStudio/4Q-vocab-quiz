<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2022-2 大問1 Vocabulary Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-bg: #f5f5f5; --p1-primary: #ff9800;
            --p2-bg: #f0f4f8; --p2-primary: #2196f3;
            --white: #ffffff; --text-dark: #212121;
            --success: #4caf50; --error: #f44336;
            --base-font: 'Andika', "Hiragino Maru Gothic ProN", sans-serif;
        }

        body { font-family: var(--base-font); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.3s; }
        body.part1-mode { background-color: var(--p1-bg); }
        body.part2-mode { background-color: var(--p2-bg); }

        header { width: 100%; padding: 20px 0; text-align: center; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .part1-mode header { background-color: var(--p1-primary); }
        .part2-mode header { background-color: var(--p2-primary); }

        .tab-container { display: flex; width: 95%; max-width: 600px; margin: 15px 0; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px 10px 0 0; background: #ccc; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--white); cursor: default; }
        .part1-mode .tab-btn.active { color: var(--p1-primary); border-top: 4px solid var(--p1-primary); }
        .part2-mode .tab-btn.active { color: var(--p2-primary); border-top: 4px solid var(--p2-primary); }

        .container { max-width: 600px; width: 92%; background: var(--white); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; margin-bottom: 30px; }
        .q-num { color: #888; margin-bottom: 10px; }
        .question-text { font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; line-height: 1.5; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .choice-btn { background: var(--white); border: 2px solid #e0e0e0; padding: 15px 5px; border-radius: 12px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; min-height: 60px; display: flex; align-items: center; justify-content: center;}
        .choice-btn.correct { background-color: var(--success) !important; color: white; border-color: var(--success); }
        .choice-btn.wrong { background-color: var(--error) !important; color: white; border-color: var(--error); opacity: 0.6; }

        #feedback-area { margin-top: 20px; display: none; padding: 15px; border-radius: 10px; background: #f0fdf4; }
        .next-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; background: var(--p1-primary); margin-top: 10px; }
        .part2-mode .next-btn { background: var(--p2-primary); }
        
        .report-btn { background-color: #e91e63; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .bonus-box { background: #fffde7; border: 2px dashed #fbc02d; padding: 20px; border-radius: 15px; margin: 20px 0; }
        ruby rt { font-size: 0.6em; }
        .sentence-gap { text-decoration: underline; font-weight: bold; color: #2196f3; padding: 0 10px; }
    </style>
</head>
<body class="part1-mode">

<header>
    <h1 style="margin:0; font-size: 1.3rem;">2022-2 大問1 Vocabulary Quiz</h1>
</header>

<div class="tab-container" id="tabs">
    <button id="tab1" class="tab-btn active" onclick="switchPart(1)">Part 1: 単語</button>
    <button id="tab2" class="tab-btn" onclick="switchPart(2)">Part 2: 熟語・文法</button>
</div>

<div class="container" id="quiz-screen">
    <div class="q-num" id="progress">Question 1 / --</div>
    <div class="question-text" id="question-display">Loading...</div>
    <div class="choices-grid" id="choices-container"></div>
    <div id="feedback-area">
        <span style="color:var(--success); font-weight:bold; font-size:1.4rem;">Correct! ✨</span><br>
        <button class="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
</div>

<div class="container" id="result-screen" style="display:none;">
    <h2>Training Complete!</h2>
    <div class="bonus-box" id="bonus-message">
        <h3 style="margin-top:0; color:#f57f17;">🎁 <ruby>特別<rt>とくべつ</rt></ruby>ボーナス</h3>
        <p id="reward-text"></p>
    </div>
    <p style="font-size: 1.2rem;">一発正解スコア: <span id="final-score" style="font-weight:bold; color:var(--success);">0</span></p>
    <button class="report-btn" onclick="sendReport()">Tamaki先生に報告する</button>
    <button class="next-btn" style="background:#9e9e9e;" onclick="location.reload()">もう一度挑戦</button>
</div>

<script>
// --- Data Structure ---
const part1Data = [
    {q:"about", a:"～について", c:["～のそばに", "～のあとに", "～といっしょに"]},
    {q:"watch", a:"見る", c:["聞く", "話す", "書く"]},
    {q:"wake", a:"起きる", c:["寝る", "歩く", "走る"]},
    {q:"ask", a:"たずねる", c:["答える", "作る", "洗う"]},
    {q:"get", a:"手に入れる", c:["あげる", "送る", "捨てる"]},
    {q:"Christmas Day", a:"クリスマス", c:["誕生日", "元旦", "夏休み"]},
    {q:"popular", a:"人気のある", c:["有名な", "親切な", "美しい"]},
    {q:"holiday", a:"祝日", c:["学校", "授業", "宿題"]},
    {q:"subject", a:"教科", c:["スポーツ", "食べ物", "趣味"]},
    {q:"sound", a:"音", c:["光", "声", "歌"]},
    {q:"room", a:"部屋", c:["家", "建物", "庭"]},
    {q:"present", a:"プレゼント", c:["手紙", "雑誌", "絵"]},
    {q:"this weekend", a:"今週末", c:["先週末", "来週末", "毎日"]},
    {q:"move to", a:"～へ引っ越す", c:["～へ行く", "～から来る", "～に住む"]},
    {q:"apartment", a:"アパート", c:["デパート", "公園", "駅"]},
    {q:"band", a:"バンド", c:["チーム", "クラス", "グループ"]},
    {q:"race", a:"レース", c:["試合", "練習", "遊び"]},
    {q:"painting", a:"絵", c:["写真", "音楽", "映画"]},
    {q:"bigger", a:"もっと大きい", c:["一番大きい", "大きい", "大きすぎる"]},
    {q:"often", a:"よく", c:["ときどき", "一度も～ない", "明日"]},
    {q:"meet", a:"会う", c:["別れる", "待つ", "探す"]},
    {q:"bring", a:"持ってくる", c:["洗う", "買う", "売る"]},
    {q:"sit", a:"座る", c:["立つ", "走る", "止まる"]},
    {q:"fall", a:"落ちる", c:["昇る", "飛ぶ", "泳ぐ"]},
    {q:"weather", a:"天気", c:["季節", "気温", "時間"]},
    {q:"dishes", a:"皿", c:["コップ", "ナイフ", "机"]},
    {q:"stars", a:"星", c:["太陽", "月", "地球"]},
    {q:"teams", a:"チーム", c:["国", "町", "村"]},
    {q:"beautiful", a:"美しい", c:["汚い", "古い", "暗い"]},
    {q:"tired", a:"疲れた", c:["空腹の", "眠い", "怒った"]},
    {q:"easy", a:"簡単な", c:["難しい", "高い", "重い"]},
    {q:"necessary", a:"必要な", c:["親切な", "有名な", "自由な"]},
    {q:"lake", a:"湖", c:["海", "川", "池"]},
    {q:"visit", a:"訪れる", c:["帰る", "出発する", "滞在する"]},
    {q:"there", a:"そこに", c:["ここに", "どこに", "あそこに"]},
    {q:"bread", a:"パン", c:["米", "肉", "野菜"]},
    {q:"sure", a:"もちろん", c:["たぶん", "決して", "残念ながら"]},
    {q:"bridge", a:"橋", c:["道", "壁", "階段"]},
    {q:"picnic", a:"ピクニック", c:["キャンプ", "パーティー", "旅行"]},
    {q:"rest", a:"休み", c:["仕事", "勉強", "運動"]},
    {q:"knife", a:"ナイフ", c:["フォーク", "スプーン", "皿"]},
    {q:"hold", a:"持つ", c:["投げる", "打つ", "蹴る"]},
    {q:"want", a:"欲しい", c:["好き", "嫌い", "必要"]},
    {q:"say", a:"言う", c:["聞く", "話す", "読む"]},
    {q:"kind", a:"親切な", c:["残酷な", "強い", "速い"]},
    {q:"student", a:"生徒", c:["先生", "親", "友達"]},
    {q:"young", a:"若い", c:["古い", "新しい", "年上の"]},
    {q:"hurt", a:"痛める", c:["治す", "洗う", "磨く"]},
    {q:"leg", a:"脚", c:["腕", "手", "頭"]}
];

const part2Data = [
    {q:"The members of the baseball team <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> catch for 15 minutes.<br>（キャッチボールをする）", a:"play", c:["hold", "want", "say"]},
    {q:"Rick often <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> a long walk with his dog.<br>（散歩をする）", a:"takes", c:["calls", "listens", "shows"]},
    {q:"I get up <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> in the morning.<br>（朝早くに）", a:"early", c:["fast", "soon", "slowly"]},
    {q:"The new English teacher from Australia was kind <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> all the students.<br>（～に親切だ）", a:"to", c:["of", "at", "as"]},
    {q:"Is there a good movie <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> TV tonight?<br>（テレビで）", a:"on", c:["for", "by", "after"]},
    {q:"What do you <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> of my chocolate cookies?<br>（～をどう思いますか？）", a:"think", c:["sing", "open", "come"]},
    {q:"James <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> go to today's baseball game because he hurt his leg.<br>（「～しないだろう」の意味になる言葉）", a:"won't", c:["isn't", "hasn't", "don't"]},
    {q:"She often brings fruit <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> after lunch.<br>（「食べるための」不定詞）", a:"to eat", c:["eating", "eats", "ate"]},
    {q:"Grandma is <span class='sentence-gap'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> sleeping, so don't watch TV.<br>（「まだ」寝ている）", a:"still", c:["yet", "already", "soon"]}
];

// --- Logic ---
let currentSet = [];
let currentIndex = 0;
let isAnswered = false;
let firstTryCount = 0;
let isFirstTryInQ = true;
let currentPartName = "";

function switchPart(partNum) {
    currentPartName = (partNum === 1) ? "Part 1 (単語)" : "Part 2 (熟語・文法)";
    document.body.className = partNum === 1 ? 'part1-mode' : 'part2-mode';
    document.getElementById('tab1').className = partNum === 1 ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tab2').className = partNum === 2 ? 'tab-btn active' : 'tab-btn';
    
    let rawData = partNum === 1 ? [...part1Data] : [...part2Data];
    currentSet = rawData.sort(() => Math.random() - 0.5);
    
    currentIndex = 0;
    firstTryCount = 0;
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    showQuestion();
}

function showQuestion() {
    isAnswered = false;
    isFirstTryInQ = true;
    document.getElementById('feedback-area').style.display = 'none';
    const data = currentSet[currentIndex];
    document.getElementById('progress').textContent = `Question ${currentIndex + 1} / ${currentSet.length}`;
    document.getElementById('question-display').innerHTML = data.q;
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    
    const choices = [data.a, ...data.c].sort(() => Math.random() - 0.5);
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = choice;
        btn.onclick = () => {
            if (isAnswered) return;
            if (choice === data.a) {
                isAnswered = true;
                if (isFirstTryInQ) firstTryCount++;
                btn.classList.add('correct');
                document.getElementById('feedback-area').style.display = 'block';
            } else {
                isFirstTryInQ = false;
                btn.classList.add('wrong');
            }
        };
        container.appendChild(btn);
    });
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentSet.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').textContent = `${firstTryCount} / ${currentSet.length}`;
    
    const reward = document.getElementById('reward-text');
    const percent = firstTryCount / currentSet.length;
    if (percent === 1) {
        reward.innerHTML = "完璧です！全問一発正解！🏅<br>この単語力があれば 2022-2 の大問1はばっちりクリアできます！";
    } else if (percent >= 0.8) {
        reward.innerHTML = "素晴らしい！合格圏内です！✨<br>間違えたところをもう一度復習してみよう！";
    } else {
        reward.innerHTML = "ナイスファイト！🌈<br>繰り返しチャレンジして満点を目指しましょう！";
    }
}

function sendReport() {
    const teacherEmail = "tamaki@eigostudio-stepforward.com";
    const subject = encodeURIComponent(`英検4級 2022-2 大問1 学習報告 (${currentPartName})`);
    const body = encodeURIComponent(`Tamaki先生へ\n\n英検4級 2022-2 大問1 Vocabulary Quizを完了しました！\n\n【今回の結果】\nコース: ${currentPartName}\n一発正解数: ${firstTryCount} / ${currentSet.length}\n\nこれからも頑張ります！`);
    window.location.href = `mailto:${teacherEmail}?subject=${subject}&body=${body}`;
}

window.onload = () => switchPart(1);
</script>
</body>
</html>
